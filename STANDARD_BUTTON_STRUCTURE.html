<!-- 
  STANDARDIZED BUTTON STRUCTURE
  Used across ALL 406 product-detail-*.html files
  
  This example shows the exact HTML structure that is now
  consistently applied to every product detail page.
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Standardized Button Example</title>
    <link rel="stylesheet" href="product-detail.css">
</head>
<body>
    <!-- STANDARD PRODUCT DETAIL STRUCTURE -->
    
    <section class="details">
        <!-- Product info content here -->
        
        <!-- STANDARDIZED CHECKOUT ACTIONS -->
        <!-- This section is now identical across ALL 406 product pages -->
        <div class="checkout-actions">
            <!-- PRIMARY BUTTON: "Add to Cart" -->
            <!-- Color: Professional Blue Gradient (#1e3a52 → #0f1419) -->
            <!-- Links to checkout.html for cart processing -->
            <a class="btn btn-primary" href="checkout.html">Add to Cart</a>
            
            <!-- SECONDARY BUTTON: "Buy Now" -->
            <!-- Color: White with blue border (#1e3a52) -->
            <!-- Links to checkout.html for immediate purchase -->
            <a class="btn btn-secondary" href="checkout.html">Buy Now</a>
        </div>
        <!-- END CHECKOUT ACTIONS -->
    </section>
</body>
</html>


<!-- 
  CSS CLASSES REFERENCE
  All styling is centralized in product-detail.css
  
  .checkout-actions
    └─ Container for both buttons
       ├─ Display: flex (side-by-side layout)
       ├─ Gap: 12px (space between buttons)
       └─ Responsive on mobile (full-width)
  
  .btn (base styling applied to both buttons)
    ├─ Flex: 1 (equal width distribution)
    ├─ Padding: 14px 18px (comfortable touch target)
    ├─ Border-radius: 12px (medium rounded corners)
    ├─ Font-weight: 700 (bold, professional look)
    ├─ Font-size: 0.95rem (readable but compact)
    ├─ Smooth transitions on hover
    └─ Transform: translateY(-1px) on hover (lift effect)
  
  .btn-primary ("Add to Cart")
    ├─ Background: Linear gradient (135deg)
    │  ├─ Start: var(--primary-700) = #1e3a52 (Deep Blue)
    │  └─ End: var(--primary-900) = #0f1419 (Dark Blue)
    ├─ Color: #fff (white text)
    └─ Hover: Lighter gradient + lift effect
  
  .btn-secondary ("Buy Now")
    ├─ Background: #fff (white)
    ├─ Color: var(--primary-700) = #1e3a52 (blue text)
    ├─ Border: 2px solid #1e3a52 (blue border)
    └─ Hover: var(--primary-100) background + lift effect
-->
